# Compila la APK y el AAB de Chispa en cada cambio de la app
name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'datos/**'
      - '.github/workflows/datos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Chispa.apk
          cp app/build/outputs/bundle/release/app-release.aab Chispa-GooglePlay.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Chispa-apk
          path: |
            Chispa.apk
            Chispa-GooglePlay.aab

      - name: Publicar para descargar desde el móvil
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chispa ${{ github.run_number }}
          body: Descarga Chispa.apk e instálala en el móvil.
          files: |
            Chispa.apk
            Chispa-GooglePlay.aab
          make_latest: true

<!doctype html><html lang="es"><head><meta charset="utf-8"><style>@font-face{font-family:'Fredoka';font-weight:500;src:url(f/fredoka-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Fredoka';font-weight:600;src:url(f/fredoka-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Fredoka';font-weight:700;src:url(f/fredoka-latin-700-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:400;src:url(f/figtree-latin-400-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:500;src:url(f/figtree-latin-500-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:600;src:url(f/figtree-latin-600-normal.woff2) format('woff2')}@font-face{font-family:'Figtree';font-weight:700;src:url(f/figtree-latin-700-normal.woff2) format('woff2')}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#A9DFFF;font-family:Figtree,sans-serif;color:#1B1464}
.bgdots{position:absolute;inset:0;background-image:radial-gradient(#1B146422 3px,transparent 3.500px);background-size:46px 46px}
.blob{position:absolute;border:5px solid #1B1464;border-radius:50%;box-shadow:8px 8px 0 #1B1464}
.phone{position:absolute;left:150px;top:28px;width:500px;height:1024px;background:#1B1464;border-radius:58px;box-shadow:14px 14px 0 #1B146455;padding:14px}
.phone .scr{width:472px;height:996px;border-radius:46px;overflow:hidden;background:#E4F7FF;position:relative}
.phone iframe{border:0;width:400px;height:844px;transform:scale(1.18);transform-origin:0 0;display:block}
.notch{position:absolute;left:50%;top:22px;width:120px;height:26px;margin-left:-60px;background:#1B1464;border-radius:16px;z-index:3;pointer-events:none}
.panel{position:absolute;left:780px;top:150px;width:1000px}
.step.nuevo{background:#FF4F79;color:#fff}.step{display:inline-block;font-family:Fredoka;font-weight:600;font-size:30px;background:#FFC93C;border:4px solid #1B1464;border-radius:999px;padding:6px 24px;box-shadow:5px 5px 0 #1B1464;transform:rotate(-2deg)}
h1{font-family:Fredoka;font-weight:700;font-size:92px;line-height:1.02;margin:34px 0 34px;text-wrap:balance}
h1 em{font-style:normal;background:#FFC93C;border:5px solid #1B1464;border-radius:18px;padding:0 16px;display:inline-block;transform:rotate(-2deg)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:20px}
li{background:#fff;border:4px solid #1B1464;border-radius:22px;box-shadow:6px 6px 0 #1B1464;padding:18px 26px;font-size:38px;font-weight:600;display:flex;gap:18px;align-items:center;width:max-content;max-width:1000px;opacity:0;transform:translateX(60px);transition:opacity .45s,transform .45s}
li.on{opacity:1;transform:none}
li i{flex:none;width:30px;height:30px;border-radius:50%;border:4px solid #1B1464;background:#4BE08A}
li:nth-child(2) i{background:#FFC93C}li:nth-child(3) i{background:#FF4F79}li:nth-child(4) i{background:#7B5CFF}
.cap{transition:opacity .35s,transform .35s}.cap.out{opacity:0;transform:translateY(24px)}
.dot{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:#FF4F79aa;border:5px solid #1B1464;z-index:20;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .3s;opacity:0;pointer-events:none}
.dot.tap{animation:tap .35s}@keyframes tap{50%{box-shadow:0 0 0 22px #FF4F7955;scale:.8}}
.noti{position:absolute;left:14px;right:14px;top:58px;z-index:5;pointer-events:none;background:#fff;border:3px solid #1B1464;border-radius:24px;box-shadow:0 14px 30px #0005;padding:14px 18px;display:flex;flex-direction:column;gap:3px;font-size:19px;transform:translateY(-220%);transition:transform .6s cubic-bezier(.2,1.2,.4,1)}.noti.on{transform:none}.noti small{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;opacity:.75}.noti small i{width:22px;height:22px;border-radius:50%;background:#FFC93C;border:2px solid #1B1464;display:inline-block}.noti strong{font-family:Fredoka;font-size:23px}
.intro{position:absolute;inset:0;background:#A9DFFF;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.intro.go{transform:translateY(-100%)}
.intro .logo{display:flex;align-items:center;gap:22px;font-family:Fredoka;font-weight:700;font-size:120px}
.intro .logo small{font-family:Figtree;font-size:34px;font-weight:600;opacity:.8;align-self:flex-end;margin-bottom:26px}
.intro h2{font-family:Fredoka;font-weight:700;font-size:84px;margin:10px 0 0;text-align:center}
.intro h2 em{font-style:normal;background:#FFC93C;border:5px solid #1B1464;border-radius:18px;padding:0 16px;display:inline-block;transform:rotate(-2deg)}
.intro .art{width:820px;margin-top:10px}.intro .art svg{width:100%;height:auto;display:block}
.intro .tags{display:flex;gap:18px;margin-top:8px}.intro .tags span{font-family:Fredoka;font-weight:600;font-size:36px;background:#fff;border:4px solid #1B1464;border-radius:999px;padding:6px 26px;box-shadow:5px 5px 0 #1B1464}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{from{opacity:0;transform:scale(.6)}}
.black{position:absolute;inset:0;background:#000;z-index:40;opacity:0;pointer-events:none;transition:opacity 1.8s;display:flex;align-items:center;justify-content:center}
.black.on{opacity:1}
.toyo{font-family:Fredoka;font-weight:700;font-size:170px;color:#1B1464;background:#FFC93C;border-radius:30px;padding:8px 60px;transform:rotate(-2deg) scale(.7);opacity:0;transition:opacity 1s,transform 1s cubic-bezier(.2,1.3,.4,1);box-shadow:0 0 90px #FFC93C99}
.toyo.on{opacity:1;transform:rotate(-2deg) scale(1)}
</style></head><body>

          <circle cx="318" cy="180" r="20" fill="#1B1464"/><circle cx="318" cy="180" r="8" fill="#fff"/>

        </g>
      </svg></div>
  <div class="tags pop" style="animation-delay:1.300s"><span>Diésel</span><span>Gasolina</span><span>Eléctrico</span><span>GLP</span></div>
</div>

<script>
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)});document.documentElement.style.overflow='hidden';
window.cap=(step,ttl,lines)=>{const c=document.getElementById('cap');c.classList.add('out');
  setTimeout(()=>{const se=document.getElementById('step');se.textContent=step;se.classList.toggle('nuevo',/^Nuevo/.test(step));document.getElementById('ttl').innerHTML=ttl;
    document.getElementById('lines').innerHTML=lines.map(l=>'<li><i></i><span>'+l+'</span></li>').join('');c.classList.remove('out');
    [...document.querySelectorAll('#lines li')].forEach((li,i)=>setTimeout(()=>li.classList.add('on'),500+i*650))},380)};
window.dotTo=(x,y)=>{const d=document.getElementById('dot');d.style.opacity=1;d.style.transform='translate('+x+'px,'+y+'px)'};
window.dotTap=()=>{const d=document.getElementById('dot');d.classList.remove('tap');void d.offsetWidth;d.classList.add('tap')};
window.dotHide=()=>{document.getElementById('dot').style.opacity=0};
</script></body></html>
